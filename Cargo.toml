[package]
name = "ndstrim"
version = "0.3.0"
edition = "2024"
readme = "README.md"
license = "MIT"
repository = "https://github.com/KakarottoCake/ndstrim-dx/"
authors = ["Nemris <nemris@protonmail.com>", "KakarottoCake"]
description = "A utility to trim NDS ROMs."

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive", "min_const_generics"] }
clap = { version = "4.6.1", features = ["derive"] }
crc = "3.4.0"

[profile.release]
lto = "thin"
strip = true
