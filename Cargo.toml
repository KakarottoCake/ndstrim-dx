[package]
name = "ndstrim"
version = "0.2.1"
edition = "2021"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Nemris/ndstrim/"
authors = ["Nemris <nemris@protonmail.com>"]
description = "An utility to trim NDS ROMs."

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive", "min_const_generics"] }
clap = { version = "4.3.0", features = ["derive"] }
crc = "3.2.1"

[profile.release]
lto = true
strip = true
